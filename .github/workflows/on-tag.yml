name: Build, test & publish image

# Every push and PR builds the image and checks it against a regtest node.
# Pushing a git tag vX.Y.Z also publishes reddcoincore/reddcoinjs-regtest-server:vX.Y.Z.

env:
  IMAGE: reddcoincore/reddcoinjs-regtest-server

on:
  push:
    branches: [ reddcoin ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="sha-${GITHUB_SHA::7}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Image: $IMAGE:$TAG"

      - name: Build image
        run: >
          docker build . -f docker/Dockerfile
          --label "commit=${{ github.sha }}"
          --label "git-tag=$TAG"
          --label "repo-url=${{ github.repositoryUrl }}"
          --tag "$IMAGE:$TAG"

      - name: Sanity check against a regtest node
        env:
          SERVER_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:8080/1/ready
          HEIGHT=$(curl -fsS http://127.0.0.1:8080/1/b/best/height)
          echo "height $HEIGHT"
          test "$HEIGHT" -ge 432
          curl -fsS -X POST "http://127.0.0.1:8080/1/r/generate?count=2&key=satoshi"
          test "$(curl -fsS http://127.0.0.1:8080/1/b/best/height)" -eq $((HEIGHT + 2))

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u="${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Published $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
